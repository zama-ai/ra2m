[package]
name = "ra2m_cpn"
description = "Ra2m common components library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
rpc = ["ra2m_ffi/rpc"]

[dependencies]
# Local dependencies
ra2m_sim.workspace = true
ra2m_ffi.workspace = true

# External dependencies
getset = "0.1.2"
once_cell = "1.10.0"
rand = "0.10"
serial_test = "0.8.0" # Rust tests one at a time prevent clashing on global simulation state
serde = { version = "1", features = ["derive"] }
crossbeam = "0.8.4"

