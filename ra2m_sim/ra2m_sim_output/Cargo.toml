[package]
name = "ra2m_sim_output"
description = "Ra2m utility to easily generate parser-ready Log and Trace messages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = []
log-debug = [] # Enable Verbosity::{Debug, Trace} in log message

[dependencies]
bincode = "1.3.3"
chrono = "0.4.19"
getset = "0.1.2" # Ease getter/setter generation
once_cell = "1.10.0"
rand = "0.10"
regex = {version = "1"}
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serial_test = "0.8.0" # Rust tests one at a time prevent clashing on global simulation state
strum = "0.24.1"
strum_macros = "0.24.3"
